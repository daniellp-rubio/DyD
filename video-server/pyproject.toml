[project]
name = "video-server"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "diffusers>=0.31.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "imageio[ffmpeg]>=2.35.0",
    "pillow>=10.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7.0",
    "protobuf>=5.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
